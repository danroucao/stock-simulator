name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure production TPEx proxy
        shell: bash
        env:
          TPEX_PROXY_URL: ${{ vars.TPEX_PROXY_URL }}
        run: |
          if [[ ! "$TPEX_PROXY_URL" =~ ^https:// ]]; then
            echo "Repository variable TPEX_PROXY_URL must contain the HTTPS Cloudflare Worker URL."
            exit 1
          fi
          printf "window.__STOCK_APP_CONFIG__ = { tpexProxyUrl: '%s' };\n" "${TPEX_PROXY_URL%/}" > public/runtime-config.js

      - name: Build Angular app
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          npm run build -- --configuration production --base-href "/${REPOSITORY_NAME}/"

      - name: Add GitHub Pages fallback files
        shell: bash
        run: |
          cp dist/stock/browser/index.html dist/stock/browser/404.html
          touch dist/stock/browser/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/stock/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
